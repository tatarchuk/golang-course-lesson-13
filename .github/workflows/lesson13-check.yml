name: Lesson 13 check

# CI of the Lesson 13 homework (gRPC microservices). Every check is reported in the job summary
# (Actions -> run -> Summary) as PASS/FAIL; a step fails at the END if at least one check failed,
# so one run shows all problems. Jobs are added as the homework grows: static, test, demo, sonar.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Protobuf compiler and the plugins pinned by the Makefile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
          protoc --version
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare check helper
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          FAILED=0
          header() {
            { echo ""; echo "### $1"; echo ""; echo "| Result | Check |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          }
          pass() {
            echo "| PASS | $1 |" >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: $1"
          }
          fail() {
            FAILED=1
            echo "| FAIL | $1 |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Check failed::$1"
            echo "FAIL: $1"
            if [ -n "${2:-}" ]; then echo "$2" | tail -n 40; fi
          }
          check() {
            local name="$1"; shift
            local out
            if out=$("$@" 2>&1); then pass "$name"; else fail "$name" "$out"; fi
          }
          EOF

      - name: Repository structure, formatting, build, documentation
        run: |
          source "$RUNNER_TEMP/check.sh"
          header "Lesson 13: static checks"

          required=(
            README.md LICENSE Makefile go.mod .gitignore .gitattributes albums_lesson13_homework.md
            libratrack-grpc-demo/Makefile libratrack-grpc-demo/go.sum docs/environment.txt docs/demo/go-test.txt
            docs/demo/quickstart.txt docs/demo/unary.txt docs/demo/server-stream.txt docs/demo/client-stream.txt
            docs/demo/bidi.txt docs/demo/gateway.txt docs/demo/auth.txt docs/demo/mtls.txt docs/demo/tests.txt
            docs/demo/bench.txt docs/demo/smoke.txt docs/demo/proto-regen.txt
            proto/albums.proto gen/albums/albums.pb.go gen/albums/albums_grpc.pb.go docs/albums/proto-gen.txt
            cmd/albums-server/main.go cmd/albums-client/main.go scripts/smoke.sh
            internal/store/store.go internal/store/model.go internal/store/seed.go internal/store/errors.go
            internal/store/store_test.go internal/server/server.go internal/server/convert.go
            internal/server/server_test.go internal/middleware/middleware.go internal/middleware/middleware_test.go
            docs/albums/tests-before.txt docs/albums/tests-after.txt docs/albums/grpcurl.txt docs/albums/client.txt
            docs/albums/smoke.txt prompts.txt
          )
          missing=""
          for f in "${required[@]}"; do [ -f "$f" ] || missing="$missing $f"; done
          if [ -z "$missing" ]; then pass "Required files exist"; else fail "Required files exist" "missing:$missing"; fi

          check "Module name is homework" grep -q '^module homework$' go.mod
          no_root_go() { [ -z "$(ls ./*.go 2>/dev/null)" ]; }
          check "No .go files in the repository root" no_root_go

          gofmt_clean() {
            local out
            out=$(gofmt -l .)
            if [ -n "$out" ]; then echo "Not formatted:"; echo "$out"; return 1; fi
          }
          check "gofmt: all files formatted" gofmt_clean
          # go vet and go build exit 1 when "./..." matches no packages; the root module gets its
          # packages in Part 2, until then these checks pass with a note.
          root_packages() { go list ./... 2>/dev/null; }
          vet_ok() { if [ -z "$(root_packages)" ]; then echo "no packages in the root module yet"; return 0; fi; go vet ./...; }
          check "go vet ./... (root module)" vet_ok
          build_ok() { if [ -z "$(root_packages)" ]; then echo "no packages in the root module yet"; return 0; fi; go build ./...; }
          check "go build ./... (root module)" build_ok
          tidy_clean() { go mod tidy && git diff --exit-code -- go.mod go.sum; }
          check "go mod tidy leaves go.mod/go.sum unchanged" tidy_clean

          # libratrack-grpc-demo is the course demo kept verbatim; its comments are Ukrainian.
          ascii_only() { ! grep -rnP '[^\x00-\x7F]' --include=*.go --exclude-dir=libratrack-grpc-demo .; }
          check "No non-ASCII characters in the homework's .go files" ascii_only

          no_tokens_in_docs() { ! grep -rEqs 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' docs README.md prompts.txt; }
          check "No JWT committed under docs/, in the README or in prompts.txt" no_tokens_in_docs

          env_not_tracked() { grep -qx '\.env' .gitignore && ! git ls-files --error-unmatch .env 2> /dev/null; }
          check ".env is ignored and not committed" env_not_tracked

          scripts_parse() { local f; for f in scripts/*.sh libratrack-grpc-demo/scripts/*.sh; do bash -n "$f" || return 1; done; }
          check "Shell scripts parse (bash -n)" scripts_parse

          # Slide 46: handlers return gRPC statuses, never plain error values.
          status_errors_only() { ! grep -q 'errors\.New(\|fmt\.Errorf(' internal/server/server.go; }
          check "Server handlers use status errors only" status_errors_only

          check "proto: package albums.v1 (versioned package, slide 17)" grep -q '^package albums.v1;' proto/albums.proto
          proto_rpcs() { [ "$(grep -c '^  rpc ' proto/albums.proto)" -eq 3 ]; }
          check "proto: three rpcs" proto_rpcs
          proto_stream() { [ "$(grep -c 'returns (stream ' proto/albums.proto)" -eq 1 ]; }
          check "proto: exactly one server-streaming rpc" proto_stream
          # Last: make proto rewrites gen/ (only the protoc version line may differ between protoc builds).
          gen_current() { make proto > /dev/null && git diff -I'^// .*protoc ' --exit-code gen/; }
          check "Generated code is current (make proto)" gen_current

          exit $FAILED

  test:
    name: Tests and smoke (own module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: Tests with the race detector and a coverage profile
        run: go test -race -count=1 -coverprofile=cover.out ./...

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: Smoke (server on 127.0.0.1:50061, the client scenarios)
        run: bash scripts/smoke.sh

      - name: Keep the coverage profile for the SonarQube Cloud job
        uses: actions/upload-artifact@v4
        with:
          name: cover.out
          path: cover.out

  demo:
    name: Course demo (libratrack-grpc-demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libratrack-grpc-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # the root go.mod: one toolchain for every job

      - name: go vet
        run: go vet ./...

      - name: go mod tidy leaves go.mod/go.sum unchanged
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Tests with the race detector
        run: go test -race -count=1 ./...

      - name: Smoke (server, gateway, the slide 44 scenarios)
        run: bash scripts/smoke.sh

      - name: Protobuf compiler and the plugins pinned by the demo Makefile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
          protoc --version
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generated code is current (make proto; only the protoc version line may differ)
        run: |
          make proto
          git diff -I'^// .*protoc ' --exit-code gen/
